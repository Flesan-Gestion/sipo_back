<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;background-color:#ffffff;color:#4d4d4d;font-size:12pt;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tbody>
    <tr><td height="10" style="height:10px;font-size:0;line-height:0;">&nbsp;</td></tr>
    {% if header_img %}
    <tr>
      <td style="padding:0;">
        <img src="http://www.gestionflesan.cl/controlflujo/system/view/sip/img/graficas_a_cambiar/{{ header_img }}" alt="" width="600" border="0" style="width:100%;max-width:600px;height:auto;display:block;border:0;">
      </td>
    </tr>
    {% endif %}
    <tr><td height="10" style="height:10px;font-size:0;line-height:0;">&nbsp;</td></tr>
    {% block body %}{% endblock %}
    <tr><td height="10" style="height:10px;font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:0;">
        <img src="http://www.gestionflesan.cl/controlflujo/system/view/sip/img/graficas_a_cambiar/Footer_Ger_Personas.jpg" alt="Gerencia de Personas Flesan" width="600" border="0" style="width:100%;max-width:600px;height:auto;display:block;border:0;">
      </td>
    </tr>
    <tr><td height="10" style="height:10px;font-size:0;line-height:0;">&nbsp;</td></tr>
    <tr>
      <td style="padding:0 60px;">
        <strong style="text-align:center;display:block;font-size:8pt;padding:5px 0 10px;">
          Esté correo se ha generado automáticamente, favor no responda.
          Si existen comentarios o dudas con respecto a la utilización de la plataforma Solicitud de Incorporación,
          comuníquese con
          <a href="mailto:martin.norambuena@flesan.cl">martin.norambuena@flesan.cl</a>
        </strong>
      </td>
    </tr>
  </tbody>
</table>
</body>
</html>
