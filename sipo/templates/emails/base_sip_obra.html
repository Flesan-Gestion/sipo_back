      <td style="display:block;padding:0;">

    <tr style="float:left;width:100%;">

      <td>

          Esté correo se ha generado automáticamente, favor no responda.
          Si existen comentarios o dudas con respecto a la utilización de la plataforma Solicitud de Incorporación,
          comuníquese con
          <a href="mailto:jorge.barrozo@flesan.cl" target="_blank">jorge.barrozo@flesan.cl</a>
        </strong>
      </td>
    </tr>
